name: campus_find
description: "Campus Find - a Lost & Found app for college students and administrators."
publish_to: "none"
version: 1.0.0+1

# Minimum tool versions. Any recent Flutter stable satisfies this
# (checked 7 Oct 2026: Flutter stable = 3.47.x).
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---------------------------------------------------------------------
  # Firebase (FlutterFire). These five packages are released together as
  # one matched set, so keep them on the same generation:
  #   firebase_core 4.x | firebase_auth 6.x | cloud_firestore 6.x
  #   firebase_storage 13.x | firebase_messaging 16.x
  # Latest releases verified on 7 Oct 2026:
  #   firebase_core 4.15.0, firebase_auth 6.7.0, cloud_firestore 6.10.0,
  #   firebase_storage 13.6.0, firebase_messaging 16.7.0
  # The "^" means "this version or any newer one in the same major
  # generation", so `flutter pub get` picks the newest matched set that
  # works with your Flutter version.
  # NOTE: firebase_messaging has no Windows support. The app only uses it
  # on Android (see lib/services/fcm_service.dart, written in Phase 18).
  # ---------------------------------------------------------------------
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # State management (beginner-friendly): ChangeNotifier + Provider.
  provider: ^6.1.2

  # Picking item photos (Android gallery/camera, Windows file dialog).
  image_picker: ^1.1.2

  # Charts for the analytics screen (pure Flutter, works on Android + Windows).
  fl_chart: ^1.1.1

  # Calls to the Python matching API (JSON over HTTPS).
  http: ^1.2.2

  # Date / time formatting.
  intl: ^0.20.2

  # File-name and extension helpers for image uploads.
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Recommended lint rules (see analysis_options.yaml).
  flutter_lints: ^6.0.0

  # In-memory Firestore for unit tests (Phase 23).
  fake_cloud_firestore: ^4.0.0

  # Simple mocking for provider tests (Phase 23).
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
